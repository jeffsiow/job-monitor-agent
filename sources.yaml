# Sources for the Daily Job Matcher.
#
# type: workday          -> fetched via Workday's CXS JSON API (no Playwright needed)
# type: playwright       -> generic scrape: loads url(s) in a headless browser, pulls
#                            out job-like links, and grabs nearby text for location scoring.
#                            Optional click_button_text will click a button (e.g. "View All")
#                            before scraping, for pages that hide postings behind a click.
# type: bamboohr / workable / wordpress_json / psft_iframe -> bespoke fetchers in agent.py
#
# To add a new company later: for a Workday-hosted board, add a "workday" entry with the
# tenant/site/location_ids from its URL. For anything else, add a "playwright" entry with
# its careers URL (ideally already filtered to Calgary/remote in the URL, since not every
# site supports that -- location is also scored after the fact as a backstop).

sources:
  # --- New target companies ---
  - name: aveva
    type: workday
    company: "AVEVA"
    tenant: aveva
    wd_host: wd3
    site: AVEVA_careers
    locale: en-GB
    location_ids: ["ce13858e525f100c6c92e5ed60dd0000"]

  - name: cognite
    type: playwright
    company: "Cognite"
    url: "https://www.cognite.com/en/company/careers?location=USA+%28remote%29#open-positions"

  - name: c3ai
    type: playwright
    company: "C3.ai"
    url: "https://c3.ai/careers"
    click_button_text: "View All"

  - name: symphonyai
    type: playwright
    company: "SymphonyAI"
    # Their jobs.symphonyai.com wrapper links out to this iCIMS-hosted board
    # (seen in an actual "Apply Now" link) -- pointed here directly since
    # iCIMS boards tend to expose cleaner structured data. Unverified against
    # the live site from this environment; adjust if the search params don't
    # give the results you expect.
    url: "https://globalcareers-symphonyai.icims.com/jobs/search?ss=1"

  - name: sight_machine
    type: playwright
    company: "Sight Machine"
    url: "https://ats.rippling.com/en-GB/sightmachine/jobs?jobBoardSlug=sightmachine&searchQuery=&workplaceType=REMOTE&country=&state=&city=&page=0&pageSize=20"

  - name: flowmingo
    type: playwright
    company: "Flowmingo"
    url: "https://talent.flowmingo.ai/careers/MTg5NTY"

  - name: apex_systems
    type: playwright
    company: "Apex Systems"
    url: "https://www.apexsystems.com/search-results-crp?catalogcode=CRP&address=&radius=50&page=1&rows=25&query=%2A&remote=true"

  - name: siemens
    type: playwright
    company: "Siemens"
    url: "https://jobs.siemens.com/en_US/externaljobs/SearchJobs/?42386=%5B812214%5D&42386_format=17546&42387=%5B813888%5D&42387_format=17547&42388=%5B14136998%5D&42388_format=17879&42389=%5B102117%2C102133%2C102134%5D&42389_format=17549&listFilterMode=1&folderRecordsPerPage=6&"

  - name: autodesk
    type: playwright
    company: "Autodesk"
    url: "https://jobs.autodesk.com/careers?start=0&location=calgary&pid=1443152973457&sort_by=distance&filter_distance=160&filter_include_remote=1&filter_include_relocation=0"

  - name: hexagon
    type: playwright
    company: "Hexagon"
    url: "https://careers-hexagonpositioning.icims.com/jobs/search?ss=1&searchLocation=--Calgary%2C+AB%2C+Canada+%2B+Tucson%2C+AZ%2C+United+States"

  # --- Kept from before ---
  - name: black_veatch
    type: playwright
    company: "Black & Veatch"
    urls:
      - "https://careers.bv.com/search/?createNewAlert=false&q=project+manager&locationsearch=canada+OR+united+states&optionsFacetsDD_customfield3=&optionsFacetsDD_customfield5=Project+Management"
      - "https://careers.bv.com/search/?createNewAlert=false&q=project+manager&locationsearch=canada&optionsFacetsDD_customfield3=&optionsFacetsDD_customfield5="

  - name: climate_tech_list
    type: playwright
    company: "Climate Tech List"
    url: "https://www.climatetechlist.com/jobs?location=calgary"

  - name: kanin_energy
    type: wordpress_json
    company: "Kanin Energy"

  - name: city_of_calgary
    type: psft_iframe
    company: "City of Calgary"

  - name: eavor
    type: bamboohr
    company: "Eavor Technologies"

  - name: seeq
    type: workable
    company: "Seeq"
