# Add to your existing config.yaml structure
serpapi:
  engine: "google_jobs"
  location: "Calgary, Alberta, Canada"
  gl: "ca"
  hl: "en"
  chips: "date_posted:week"    # <--- Restricts SerpApi to last 7 days
  cache_enabled: true
  cache_file: "data/search_cache.json"
  cache_ttl_hours: 24

# Keep your candidate resume context and memory paths intact
memory:
  bank_id: "candidate_profile"
  cache_dir: "data/cache"
