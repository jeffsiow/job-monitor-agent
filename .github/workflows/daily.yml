name: Daily Job Agent
  env:
    OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  run: python agent.py

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        run: python agent.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: job-agent-reports
          path: reports/
