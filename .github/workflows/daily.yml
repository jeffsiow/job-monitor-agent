name: Daily Job Matcher Agent

on:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC (6:00 AM MDT)
  workflow_dispatch: # Allows manual run button in GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Cache Python libraries
    - name: Cache Pip Packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Cache HuggingFace Sentence Transformers & Cross-Encoder models
    - name: Cache Transformer Models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-models

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install chromium and system dependencies for Headless rendering
        python -m playwright install chromium --with-deps

    - name: Run Job Matcher
      run: python agent.py

    # Commit updated memory.json and docs/ back to GitHub
    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add memory.json docs/ reports/
        git commit -m "auto: update daily job report and memory [skip ci]" || echo "No changes to commit"
        git push