name: Daily Job Matcher Agent

on:
  schedule:
    - cron: '0 12 * * *' # Runs daily at 12:00 UTC (6:00 AM MDT)
  workflow_dispatch: # Manual run button

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Safety net: cancels automatically if hanging past 30 mins

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Passes the auto-generated authentication token
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Pip Packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache Transformer Models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-models

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium --with-deps

    - name: Run Job Matcher
      run: python agent.py

    - name: Commit and Push Report & Memory
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add memory.json docs/ reports/
        git commit -m "auto: update daily job report and memory [skip ci]" || echo "No changes to commit"
        git push