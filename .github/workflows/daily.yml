name: Daily Job Matcher

on:
  schedule:
    - cron: '0 13 * * *' # Runs daily at 7 AM MDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Run Job Matcher
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python agent.py

      - name: Commit and Push Updated Reports & Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ reports/ jobs_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update job recommendations and cache" && git push)
